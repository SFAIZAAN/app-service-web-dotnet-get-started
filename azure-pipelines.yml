trigger:
  - main

pr:
  - main

pool:
  vmImage: windows-latest

variables:
  solution: 'sf rental app.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

stages:
  - stage: Build
    displayName: CI - Build and package
    jobs:
      - job: BuildWebApp
        displayName: Build ASP.NET MVC app
        steps:
          - task: NuGetToolInstaller@1
            displayName: Install NuGet

          - task: NuGetCommand@2
            displayName: Restore NuGet packages
            inputs:
              restoreSolution: '$(solution)'

          - task: VSBuild@1
            displayName: Build and package web app
            inputs:
              solution: '$(solution)'
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'
              msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:PackageLocation="$(Build.ArtifactStagingDirectory)\SF-Rental.zip"'

          - task: PublishBuildArtifacts@1
            displayName: Publish build package
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: drop
              publishLocation: Container
